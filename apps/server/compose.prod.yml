name: server

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agendapets-api:prod-local
    container_name: agendapets-api
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

networks:
  edge:
    external: true
    name: proovian_edge
