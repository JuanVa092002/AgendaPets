spring.datasource.url=jdbc:h2:mem:agendapets_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
jwt.secret=test-secret-only-not-production-32-characters-min
app.cors.allowed-origins=http://localhost:5500
app.seed.enabled=false
spring.profiles.active=test
