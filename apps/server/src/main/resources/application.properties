spring.application.name=agendapets

# ===================================================================
# Configuración de Base de Datos - Neon PostgreSQL
# ===================================================================
# Endpoint directo recomendado para Spring Boot / HikariCP
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-old-moon-aynusiem.c-5.us-east-2.aws.neon.tech/agendapets?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_pbeP0haOQAv2}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuración JPA / Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Configuración HikariCP (Pool de Conexiones optimizado para Neon)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000
