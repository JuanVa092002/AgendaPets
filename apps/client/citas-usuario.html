<body class="mis-citas-body">
    <!-- TRAE NAVBAR -->
    <div id="navbar-container"></div>

    <main class="mis-citas-page">

        <section class="mis-citas-header">
            <div class="container">
                <h1 class="titulo-miscitas">Mis citas</h1>

                </p>
            </div>
        </section>

        <!-- CONTENEDOR DE CITAS -->
        <section class="citas-section">

                <div id="mensajeCitas"></div>
                <!--    CONTENEDOR DE CITAS   -->

                <div id="citasContainer" class="citas-container"></div>

        <div class="background-shapes" aria-hidden="true">

            <img class="bg-shape bg-leaf leaf2" src="./assets/contactanos/hoja2.svg" alt="">
            <img class="bg-shape bg-paw paw1" src="./assets/contactanos/huella.svg" alt="">
